<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Loading Blockly@rduino...</title>
    <script>
      // Zjistí jazyk prohlížeče uživatele
      var userLang = navigator.language || navigator.userLanguage;
      var langParam = "en"; // Angličtina jako výchozí
      
      // Pokud je prohlížeč český nebo slovenský, přepneme na CS
      if (userLang.startsWith("cs") || userLang.startsWith("sk")) {
        langParam = "cs";
      }
      
      // Provede přesměrování
      var targetUrl = "tools/BlocklyArduinoPlugin/tool/Blockly@rduino/?font=O&card=arduino_nano&lang=" + langParam;
      window.location.replace(targetUrl);
    </script>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; margin-top: 15%; color: #333; }
      a { color: #0078D7; text-decoration: none; font-weight: bold; margin: 0 15px; font-size: 18px; }
      a:hover { text-decoration: underline; }
      .fallback { margin-top: 30px; }
    </style>
  </head>
  <body>
    <h2>Loading... / Načítání...</h2>
    
    <div class="fallback">
      <p>If you are not redirected automatically, please choose your language:<br>
      Pokud nebudete automaticky přesměrováni, vyberte si jazyk:</p>
      
      <a href="tools/BlocklyArduinoPlugin/tool/Blockly@rduino/?font=O&lang=cs&card=arduino_nano">🇨🇿 Čeština</a>
      <a href="tools/BlocklyArduinoPlugin/tool/Blockly@rduino/?font=O&lang=en&card=arduino_nano">🇬🇧 English</a>
    </div>
  </body>
</html>
